
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentHub - Register</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">

    <style>

        /* Registration Form */

        .register-section {
            max-width: 900px;
            margin: 15px auto;
            padding: 20px;
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .register-section h2 {
            margin-top: 0;
            color: #4f46e5;
            border-bottom: 2px solid #f3f4f6;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        #studentRegisterForm {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 20px;
        }

        .form-group {
            margin-bottom: 5px;
        }

        .form-group label {
            display: block;
            margin-bottom: 3px;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 7px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: 2px solid #4f46e5;
        }

        .inline-group {
            display: flex;
            gap: 15px;
            align-items: center;
            margin-top: 5px;
        }

        .inline-group label {
            font-weight: normal;
            margin-bottom: 0;
            cursor: pointer;
        }

        .error-message {
            color: #dc2626;
            font-size: 11px;
            margin-top: 3px;
            display: block;
            min-height: 12px;
        }

        /* Password Strength */

        .strength-container {
            margin-top: 3px;
        }

        .strength-meter {
            height: 6px;
            width: 100%;
            background-color: #e5e7eb;
            border-radius: 3px;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease,
                        background-color 0.3s ease;
        }

        .strength-text {
            font-size: 12px;
            font-weight: bold;
            margin-top: 3px;
            display: block;
        }

        /* Register Button */

        .register-btn {
            grid-column: 1 / -1;
            width: 100%;
            background-color: #4f46e5;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .register-btn:hover {
            background-color: #4338ca;
        }

        /* Mobile View */

        @media (max-width: 600px) {

            #studentRegisterForm {
                grid-template-columns: 1fr;
            }

            .register-section {
                margin: 10px;
                padding: 15px;
            }

            .register-btn {
                grid-column: auto;
            }

        }

    </style>

</head>

<body>

    <!-- Header -->

    <header>

        <div>
            <h1>StudentHub</h1>
            <p>Your Digital Campus Portal</p>
        </div>

    </header>


    <!-- Navigation -->

    <nav id="navMenu">

        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="register.html"
           style="font-weight: bold;">Register</a>
        <a href="login.html">Login</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="events.html">Events</a>
        <a href="profile.html">Profile</a>
        <a href="faq.html">FAQ</a>

    </nav>


    <!-- Main Content -->

    <main>

        <section class="register-section">

            <h2>Student Registration</h2>


            <form id="studentRegisterForm" novalidate>


                <!-- Full Name -->

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input type="text"
                           id="fullName"
                           name="fullName"
                           aria-describedby="fullNameError"
                           required>

                    <span class="error-message"
                          id="fullNameError"
                          aria-live="polite"></span>

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input type="email"
                           id="email"
                           name="email"
                           aria-describedby="emailError"
                           required>

                    <span class="error-message"
                          id="emailError"
                          aria-live="polite"></span>

                </div>


                <!-- Mobile -->

                <div class="form-group">

                    <label for="mobile">
                        Mobile Number
                    </label>

                    <input type="tel"
                           id="mobile"
                           name="mobile"
                           aria-describedby="mobileError"
                           required>

                    <span class="error-message"
                          id="mobileError"
                          aria-live="polite"></span>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input type="password"
                           id="password"
                           name="password"
                           aria-describedby="passwordError"
                           required>


                    <div class="strength-container">

                        <div class="strength-meter">

                            <div id="strengthBar"
                                 class="strength-bar"></div>

                        </div>

                        <span id="strengthText"
                              class="strength-text"></span>

                    </div>


                    <span class="error-message"
                          id="passwordError"
                          aria-live="polite"></span>

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input type="password"
                           id="confirmPassword"
                           name="confirmPassword"
                           aria-describedby="confirmPasswordError"
                           required>

                    <span class="error-message"
                          id="confirmPasswordError"
                          aria-live="polite"></span>

                </div>


                <!-- Course -->

                <div class="form-group">

                    <label for="course">
                        Course Branch
                    </label>

                    <select id="course"
                            name="course"
                            aria-describedby="courseError"
                            required>

                        <option value="">
                            -- Choose Course --
                        </option>

                        <option value="BTech">
                            B.Tech CSE
                        </option>

                        <option value="BCA">
                            BCA
                        </option>

                        <option value="MCA">
                            MCA
                        </option>

                    </select>

                    <span class="error-message"
                          id="courseError"
                          aria-live="polite"></span>

                </div>


                <!-- Year -->

                <div class="form-group">

                    <label for="year">
                        Year of Study
                    </label>

                    <select id="year"
                            name="year"
                            aria-describedby="yearError"
                            required>

                        <option value="">
                            -- Choose Year --
                        </option>

                        <option value="1">
                            1st Year
                        </option>

                        <option value="2">
                            2nd Year
                        </option>

                        <option value="3">
                            3rd Year
                        </option>

                        <option value="4">
                            4th Year
                        </option>

                    </select>

                    <span class="error-message"
                          id="yearError"
                          aria-live="polite"></span>

                </div>


                <!-- Gender -->

                <div class="form-group">

                    <label>Gender</label>

                    <div class="inline-group">

                        <label>
                            <input type="radio"
                                   name="gender"
                                   value="Male">
                            Male
                        </label>

                        <label>
                            <input type="radio"
                                   name="gender"
                                   value="Female">
                            Female
                        </label>

                        <label>
                            <input type="radio"
                                   name="gender"
                                   value="Other">
                            Other
                        </label>

                    </div>

                    <span class="error-message"
                          id="genderError"
                          aria-live="polite"></span>

                </div>


                <!-- Terms -->

                <div class="form-group">

                    <div class="inline-group">

                        <input type="checkbox"
                               id="terms"
                               name="terms"
                               aria-describedby="termsError"
                               style="width: auto;"
                               required>

                        <label for="terms">
                            I accept the institutional campus code guidelines
                        </label>

                    </div>

                    <span class="error-message"
                          id="termsError"
                          aria-live="polite"></span>

                </div>


                <!-- Submit -->

                <button type="submit"
                        class="register-btn">

                    Register

                </button>


            </form>

        </section>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            &copy; 2026 StudentHub. All Rights Reserved.
        </p>

    </footer>


    <!-- JavaScript -->

    <script src="../js/Script.js"></script>

</body>

</html>
